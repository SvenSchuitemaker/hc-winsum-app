name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy analyze-exercise-photo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN. Add a Supabase Personal Access Token under GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Node.js for Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Supabase CLI
        run: npx --yes supabase@latest --version

      - name: Deploy exercise photo analyzer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy analyze-exercise-photo --project-ref shllbltitjogepjeyxdr
